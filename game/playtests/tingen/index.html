<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>廷根之變｜橋下的回信</title>
<style>
:root{color-scheme:dark;--night:#111819;--panel:#192425;--ink:#eee4cc;--muted:#bdb59f;--gold:#e3bc74;--line:#54635c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#273737,var(--night) 58%);color:var(--ink);font:17px/1.8 system-ui,sans-serif;min-height:100vh}
main{max-width:1060px;margin:auto;padding:clamp(22px,5vw,62px) clamp(16px,4vw,44px)}header{border-bottom:1px solid var(--line);margin-bottom:24px;padding-bottom:19px}header p{margin:0;color:var(--gold);font-size:.83rem;letter-spacing:.14em}h1,h2,h3{font-family:"Noto Serif CJK TC",serif;line-height:1.28}h1{margin:.25em 0 .35em;font-size:clamp(2rem,5vw,3.55rem)}header .intro{letter-spacing:0;color:var(--muted);font-size:.97rem}
.layout{display:grid;grid-template-columns:minmax(245px,.8fr) minmax(0,1.3fr);gap:22px;align-items:start}.map,.scene{border:1px solid var(--line);background:var(--panel);box-shadow:0 12px 34px #080d0d60}.map{padding:14px}.map h2{margin:0 0 10px;font-size:1rem;color:var(--gold)}.streets{position:relative;min-height:225px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:18px;padding:18px 10px;background:repeating-linear-gradient(0deg,#85918711 0 1px,transparent 1px 15px),repeating-linear-gradient(90deg,#85918711 0 1px,transparent 1px 15px),#131e1f}.streets::before{content:"";position:absolute;inset:52% 0 auto;height:20px;border-top:2px solid #597473;border-bottom:2px solid #597473;background:#294647;transform:skewY(-6deg)}.streets span{position:relative;align-self:center;text-align:center;border:1px solid #60706a;background:#243433;padding:9px 2px;font-size:.84rem}.streets .here{border-color:var(--gold);color:var(--gold);background:#393b2b}.map p{font-size:.87rem;color:var(--muted);margin:10px 0 0}.scene{padding:clamp(16px,4vw,31px)}.phase{margin:0 0 8px;color:var(--gold);font-size:.83rem}.scene h2{margin:0 0 12px;font-size:clamp(1.5rem,4vw,2.1rem)}.scene p{white-space:pre-line}.actions{display:grid;gap:9px;margin-top:18px}button{font:inherit;color:var(--ink);background:#243432;border:1px solid #728078;border-radius:2px;padding:9px 13px;text-align:left;cursor:pointer}button:hover{background:#354845;border-color:var(--gold)}button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.reset{margin-top:15px;font-size:.84rem;background:transparent;color:var(--muted)}.clues{padding-left:1.25em;margin:0;color:var(--muted)}footer{margin-top:20px;font-size:.8rem;color:var(--muted)}
@media(max-width:700px){.layout{grid-template-columns:1fr}.map{order:2}.streets{min-height:142px}}
</style>
</head>
<body>
<main>
<header><p>第五紀 · 廷根</p><h1>橋下的回信</h1><p class="intro">從危機前一週走到事後第一週。每個窗口只有一趟來得及親自辦的差事。</p></header>
<div class="layout">
<aside class="map" aria-labelledby="map-title"><h2 id="map-title">廷根街區</h2><div class="streets"><span data-place="office">黑荊棘</span><span data-place="warehouse">倉庫巷</span><span data-place="bridge">石橋</span><span data-place="street">俱樂部外街</span></div><p id="location"></p></aside>
<section class="scene" aria-live="polite" aria-labelledby="scene-title">
<p class="phase" id="phase"></p><h2 id="scene-title" tabindex="-1"></h2><p id="body"></p>
<ul class="clues" id="clues" hidden></ul><div class="actions" id="actions"></div>
<button type="button" class="reset" id="reset">回到同一個起點</button>
</section></div>
<footer>《詭秘之主》非官方遊戲測試 · 玩家差事、證人與對白為遊戲原創</footer>
</main>
<script>
"use strict";
const canon = Object.freeze({
  crisisOccurred: true, descentStopped: true, megoseDead: true,
  unbornDead: true, dunnDead: true, kleinDied: true,
  kleinReturnedAndLeft: true, ashesHolder: "ince"
});
function newGame() {
  return {
    phase: "before", place: "street", noticeFiled: false, shelterReady: false,
    routeExposed: false, witnessSheltered: false, publicSightings: false,
    guardAtSideDoor: false, transferStub: false,
    nameOnFile: false, signedReport: false, safeRoom: false, newAddress: false,
    afterAction: null, caseExcerpt: false, permittedTestimony: false, tradeContact: false, custodyLead: false, theftLead: false, world: null
  };
}
const prepare = [
  ["report", "把獲准的病院節錄送去黑荊棘", {noticeFiled:true,place:"office"}],
  ["shelter", "去石橋下確認能收留證人的房間", {shelterReady:true,place:"bridge"}],
  ["trade", "把已核對的倉庫巷路線交給密修會接頭人", {routeExposed:true,place:"warehouse"}],
  ["ignore", "照常離開，維持原本的日程", {place:"street"}]
];
function crisisActions(s) {
  return [
    ...(s.noticeFiled ? [["testify","到黑荊棘門外核對來客時刻，留下具名證詞",{signedReport:true,nameOnFile:true,place:"office"}],
      ["guard","交出你剛查明的假調令，請外圍值夜者守住側門",{guardAtSideDoor:true,nameOnFile:true,place:"office"}]] : []),
    ...(s.shelterReady ? [["escort","照約把願意離開的證人帶到石橋下",{witnessSheltered:true,place:"bridge"}]] : []),
    ...(s.routeExposed ? [["follow","追上接頭人，確認他實際換到哪一扇門",{newAddress:true,place:"warehouse"}]] : []),
    ["guide","在外街指引路人離開，記下有把握的見聞",{publicSightings:true,place:"street"}],
    ["leave","離開現場，照原日程過完這一週",{place:"street"}]
  ];
}
function aftermathActions(s) {
  return [
    ...(s.world.ashesHolder === "night-watch" && s.transferStub ?
      [["custody","依假調令的收件地址，追查側門接應者",{custodyLead:true,place:"office"}]] : []),
    ...(s.world.ashesHolder === "ince" && s.signedReport ?
      [["theft","跟進骨灰失竊案，沿實際交接時刻核對出城紀錄",{theftLead:true,place:"office"}]] : []),
    ...(s.signedReport ? [["case","赴黑荊棘回訪，領取獲准查閱的案卷節錄",{caseExcerpt:true,place:"office"}]] : []),
    ...(s.safeRoom ? [["visit","到石橋回訪證人，取得可轉交的具名證詞",{permittedTestimony:true,place:"bridge"}]] : []),
    ...(s.newAddress ? [["meeting","到新地址赴約，取得下一次交易的接頭方式",{tradeContact:true,place:"warehouse"}]] : []),
    ...(s.routeExposed && !s.newAddress ? [["check","去倉庫巷找接頭人，核對舊門是否仍在用",{place:"warehouse"}]] : []),
    ...(s.publicSightings ? [["sightings","回外街與接待員核對疏散見聞",{place:"street"}]] : []),
    ["public","到外街讀公告，核對可公開的善後消息",{place:"street"}]
  ];
}
function choices(s) {
  if (s.phase === "before") return prepare;
  if (s.phase === "crisis") return crisisActions(s);
  if (s.phase === "after") return aftermathActions(s);
  return [];
}
function step(s,id) {
  const action = choices(s).find(option => option[0] === id);
  if (!action) return s;
  const next = {...s,...action[2]};
  if (s.phase === "before") return {...next,phase:"crisis"};
  if (s.phase === "crisis") {
    const intercepted = next.noticeFiled && next.guardAtSideDoor;
    const world = intercepted ? {...canon,ashesHolder:"night-watch"} : canon;
    return {...next,phase:"after",world,transferStub:intercepted,safeRoom:next.witnessSheltered};
  }
  return {...next,phase:"done",afterAction:id};
}
const phases = {before:"危機前一週",crisis:"危機當日",after:"事後第一週",done:"一週交接"};
const places = {office:"黑荊棘",warehouse:"倉庫巷",bridge:"石橋",street:"俱樂部外街"};
const outcomes = {
  custody:"你跟著值夜者找到假調令上的收件處。值班人認出曾有人來打聽側門交班，交給你一張准許帶走的領件存根。骨灰已重新入庫。這次要查的是誰替因斯安排了接應。",
  theft:"案卷確認骨灰已失竊。你把側門出入時刻和出城紀錄放在一起，圈出一筆待查的交接。值夜者讓你保留獲准的摘錄，等下次有可靠消息再接續。",
  case:"接待員把准你查閱的兩頁放進信封。卷上有你的名字。下次查訪時，他會按約找你。",
  visit:"證人把折好的紙親手交給你，只准你把那一段轉交黑荊棘。街坊把房門鑰匙留在桌上。",
  meeting:"新門後的人確認你見過舊接頭人，留下下次見面的時段。舊門今後不再收件。",
  check:"原來那扇門已換了鎖。鄰居只知道有人搬走。你得找到能核實的新聯絡，交易才有下文。",
  sightings:"你只說自己親眼看見的部分。接待員把外街的時間添到簿上，留下回信方式。",
  public:"你看完貼在外街的善後告示。名字只列到公告准許公開的範圍。你記下日期，按原行程離開。"
};
function clues(s) {
  return [
    s.world?.ashesHolder === "night-watch" && "值夜者當面告知你，骨灰已重新入庫。原先準備追查失竊的案卷沒有立案，留下的是假調令。",
    s.signedReport && s.world?.ashesHolder === "ince" && "案卷列出骨灰失竊及待查的出城時段。",
    s.signedReport && "黑荊棘的回信有你的名字，並附了回訪時段。",
    s.safeRoom && "石橋下那間屋還留著一盞燈。證人已親自報平安。",
    s.routeExposed && "倉庫巷的舊門已換鎖。收到路線的人提前撤走了接應。",
    s.newAddress && "接頭人親手給了你新地址，並提醒你帶上原票根。"
  ].filter(Boolean);
}
function scene(s) {
  if (s.phase === "before") return ["一張退回的信","你在廷根的俱樂部替人抄寫。今天有一封募資訊息被退回。你手上有證人允許轉交的病院節錄，也知道曾被你核對過的倉庫巷。天黑前只來得及親自跑一趟。"];
  if (s.phase === "crisis") {
    const setup = s.noticeFiled ? "黑荊棘核實了你交的時段，外圍值夜者已到。你在側門看見一名自稱奉命來搬封存物的接應者。他出示的調令寫了已撤銷的印記。值夜者要你立刻決定，是留在正門記錄來客，還是把調令送給側門守衛。" :
      s.shelterReady ? "石橋下已有人接應。證人答應，若你去找她，她願意跟你走。" :
      s.routeExposed ? "倉庫巷的接頭人得知消息後提早搬離。你還看得見他的車尾。" :
      "你在外街聽到有人請路人別再往前。";
    return ["她從正門進來","梅高歐絲抵達黑荊棘。門口有人往外張望。\n"+setup];
  }
  if (s.phase === "after") {
    const news = s.world.ashesHolder === "night-watch"
      ? "側門守衛核對調令後拒絕交接。因斯撤離，沒拿到骨灰。守衛從接應人留下的調令上查到了收件地址。"
      : "黑荊棘隔了幾日才重新開門。街上傳出傷亡消息，知道內情的人各自保管著紀錄。";
    return ["事後的第一封信",news+"\n你可以回訪一處。"];
  }
  return ["把回信留下",outcomes[s.afterAction]];
}
const byId = id => document.getElementById(id);
let state = newGame();
function render(focus = false) {
  const [title,body] = scene(state);
  byId("phase").textContent = phases[state.phase];
  byId("scene-title").textContent = title;
  byId("body").textContent = body;
  byId("location").textContent = "你目前在" + places[state.place] + "。";
  document.querySelectorAll("[data-place]").forEach(node => {
    const here = node.dataset.place === state.place;
    node.classList.toggle("here",here);
    if (here) node.setAttribute("aria-current","location");
    else node.removeAttribute("aria-current");
  });
  const visibleClues = state.phase === "after" || state.phase === "done" ? clues(state) : [];
  byId("clues").hidden = visibleClues.length === 0;
  byId("clues").replaceChildren(...visibleClues.map(line => {
    const li = document.createElement("li");
    li.textContent = line;
    return li;
  }));
  byId("actions").replaceChildren(...choices(state).map(([id,label]) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = label;
    button.addEventListener("click",() => {
      state = step(state,id);
      render(true);
    });
    return button;
  }));
  if (focus) byId("scene-title").focus();
}
byId("reset").addEventListener("click",() => {
  state = newGame();
  render(true);
});
render();
</script>
</body>
</html>
