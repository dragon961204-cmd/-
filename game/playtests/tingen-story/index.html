<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>詭秘之主｜廷根篇</title>
<style>
:root{color-scheme:dark;--night:#111819;--panel:#192425;--ink:#eee4cc;--muted:#bdb59f;--gold:#e3bc74;--line:#54635c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#273737,var(--night) 58%);color:var(--ink);font:17px/1.8 system-ui,sans-serif;min-height:100vh}
main{max-width:1060px;margin:auto;padding:clamp(22px,5vw,62px) clamp(16px,4vw,44px)}header{border-bottom:1px solid var(--line);margin-bottom:24px;padding-bottom:19px}header p{margin:0;color:var(--gold);font-size:.83rem;letter-spacing:.14em}h1,h2,h3{font-family:"Noto Serif CJK TC",serif;line-height:1.28}h1{margin:.25em 0 .35em;font-size:clamp(2rem,5vw,3.55rem)}header .intro{letter-spacing:0;color:var(--muted);font-size:.97rem}
.layout{display:grid;grid-template-columns:minmax(245px,.8fr) minmax(0,1.3fr);gap:22px;align-items:start}.map,.scene{border:1px solid var(--line);background:var(--panel);box-shadow:0 12px 34px #080d0d60}.map{padding:14px}.map h2{margin:0 0 10px;font-size:1rem;color:var(--gold)}.streets{position:relative;min-height:225px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:18px;padding:18px 10px;background:repeating-linear-gradient(0deg,#85918711 0 1px,transparent 1px 15px),repeating-linear-gradient(90deg,#85918711 0 1px,transparent 1px 15px),#131e1f}.streets::before{content:"";position:absolute;inset:52% 0 auto;height:20px;border-top:2px solid #597473;border-bottom:2px solid #597473;background:#294647;transform:skewY(-6deg)}.streets button{position:relative;align-self:center;text-align:center;border:1px solid #60706a;background:#243433;padding:9px 2px;font-size:.84rem}.streets .here{border-color:var(--gold);color:var(--gold);background:#393b2b}.map p{font-size:.87rem;color:var(--muted);margin:10px 0 0}.scene{padding:clamp(16px,4vw,31px)}.phase{margin:0 0 8px;color:var(--gold);font-size:.83rem}.scene h2{margin:0 0 12px;font-size:clamp(1.5rem,4vw,2.1rem)}.scene p{white-space:pre-line}.actions{display:grid;gap:9px;margin-top:18px}button{font:inherit;color:var(--ink);background:#243432;border:1px solid #728078;border-radius:2px;padding:9px 13px;text-align:left;cursor:pointer}button:hover{background:#354845;border-color:var(--gold)}button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}button:disabled{opacity:.55;cursor:default}button:disabled:hover{background:#243432;border-color:#728078}.save-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;padding-top:13px;border-top:1px solid var(--line)}.save-controls button,#advance{font-size:.88rem}#advance{margin-top:15px}#save-status{margin:8px 0 0;color:var(--muted);font-size:.88rem}.clues{padding-left:1.25em;margin:0;color:var(--muted)}footer{margin-top:20px;font-size:.8rem;color:var(--muted)}
[hidden]{display:none!important}#creation{max-width:620px;margin:auto}form{display:grid;gap:12px;margin:16px 0}form label{display:grid;gap:5px}input{font:inherit;color:var(--ink);background:#131e1f;border:1px solid #728078;padding:7px 10px;max-width:100%}.streets{display:grid;min-height:0;grid-template-rows:none;gap:8px;padding:10px}.streets::before{pointer-events:none}.streets button{width:100%;padding:8px 5px}.actions button{line-height:1.55}#result{padding:10px 12px;background:#28372f;border-left:2px solid var(--gold);color:var(--ink)}#creation-status:empty,#save-status:empty{display:none}
@media(max-width:700px){.layout{grid-template-columns:1fr}.streets{min-height:142px}}
</style>
</head>
<body>
<main>
<header><p>《詭秘之主》開放世界 RPG</p><h1>廷根篇</h1><p class="intro">第五紀 1349 年</p></header>
<section class="scene" id="creation" aria-labelledby="creation-title">
<h2 id="creation-title">建立角色</h2>
<p>你出生在廷根的工人家庭。今早，家人讓你在上工前去買煤。</p>
<form id="character-form">
<label>姓名 <input id="character-name" name="name" required maxlength="40" autocomplete="off"></label>
<label>年齡 <input id="character-age" name="age" type="number" min="1" step="1" required></label>
<button type="submit" id="create-character" disabled>從清晨開始</button>
</form>
<button type="button" id="continue" disabled>讀取存檔</button>
<p id="creation-status" role="status"></p>
<noscript>請啟用 JavaScript 以開始遊戲。</noscript>
</section>
<div class="layout" id="game" hidden>
<aside class="map" aria-labelledby="map-title"><h2 id="map-title">廷根街區</h2><div class="streets" id="locations"></div><p id="location"></p><p>每次走訪花 1 AP。</p></aside>
<section class="scene" aria-live="polite" aria-labelledby="scene-title">
<p class="phase" id="phase"></p><h2 id="scene-title" tabindex="-1">廷根</h2><p id="body">若直接開啟檔案，請改用本機伺服器載入事件資料。</p>
<p id="result" hidden></p><ul class="clues" id="clues" hidden></ul><div class="actions" id="actions"></div>
<button type="button" id="advance" hidden></button>
<div class="save-controls">
<button type="button" id="save" disabled>存檔</button>
<button type="button" id="load" disabled>讀檔</button>
<button type="button" id="reset" disabled>重新開始</button>
</div>
<p id="save-status" role="status"></p>
</section></div>
<footer>《詭秘之主》非官方同人文字 RPG</footer>
</main>
<script type="module" src="./play.mjs"></script>
</body>
</html>
