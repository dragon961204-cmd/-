name: Import 278 LOTM character pages
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-lotm-278.yml'
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect published-page HTML structure
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          u="https://www.lotmfanwiki.com/type/p.html"
          r=requests.get(u,timeout=35)
          print("HTTP",r.status_code,"LEN",len(r.content),"URL",r.url)
          soup=BeautifulSoup(r.text,"html.parser")
          print("TITLE",soup.title.get_text(" ",strip=True) if soup.title else "(none)")
          print("TABLES",len(soup.select("table")),"BOLD",len(soup.select("b,strong")))
          print("LINKS",len(soup.select("a[href]")),"DIVS",len(soup.select("div")))
          print("HEAD",r.text[:4000])
          print("LINKS FIRST",[(a.get_text(" ",strip=True)[:60],a.get("href")) for a in soup.select("a[href]")[:30]])
          print("BOLD FIRST",[(x.get_text(" ",strip=True)[:70],str(x.parent)[:250]) for x in soup.select("b,strong")[:15]])
          PY
      - name: Collect exactly 278 published character pages
        run: python scripts/import_lotm_278.py
      - name: Commit verified page catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lore/characters/lotmfanwiki_published_278.json
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "data: import exact 278 published LOTM character pages"
            git push
          fi
