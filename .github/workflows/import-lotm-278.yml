name: Import 278 LOTM character pages
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-lotm-278.yml'
      - 'scripts/import_lotm_278.py'
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Collect exactly 278 published character pages
        run: python scripts/import_lotm_278.py
      - name: Commit verified page catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lore/characters/lotmfanwiki_published_278.json
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "data: import exact 278 published LOTM character pages"
            git push
          fi
