name: Enrich all 278 LOTM wiki source pages
on:
  push:
    paths:
      - '.github/workflows/enrich-lotm-pages.yml'
      - 'scripts/enrich_lotm_source_pages.py'
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 opencc-python-reimplemented
      - name: Extract structured source metadata for all 278 pages
        run: python scripts/enrich_lotm_source_pages.py
      - name: Commit source metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lore/characters/source_page_dossiers_v0.1.json
          if ! git diff --cached --quiet; then
            git commit -m "research: extract navigation and factual metadata for all 278 source pages"
            git push
          fi
